name: apply fast IPv6 punch tuning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fast-punch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync retry regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('p2p/wireguard-p2p/tests/test_peer_logic.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_repeated_probe_failures_enter_long_cooldown(self):
        self.assertEqual(agent.retry_delay(1), 60)
        self.assertEqual(agent.retry_delay(2), 120)
        self.assertEqual(agent.retry_delay(3), 1800)
        self.assertEqual(agent.retry_delay(20), 1800)
'''
          new = '''    def test_repeated_probe_failures_enter_long_cooldown(self):
        self.assertEqual(agent.retry_delay(1), 3)
        self.assertEqual(agent.retry_delay(2), 10)
        self.assertEqual(agent.retry_delay(3), 1800)
        self.assertEqual(agent.retry_delay(20), 1800)
'''
          if old not in text:
              raise SystemExit('expected retry regression block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p2p/wireguard-p2p/tests/test_peer_logic.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: update fast IPv6 retry expectations'
          git push origin HEAD:main
