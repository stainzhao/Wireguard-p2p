name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository hygiene
        run: |
          test ! -e p2p/wireguard-p2p/linux/p2p_sync.py
          test ! -e p2p/wireguard-p2p/linux/wireguard-p2p-sync.service
          test ! -e p2p/wireguard-p2p-exe
          test ! -e p2p/wireguard-p2p/journald-wireguard-p2p.conf
          test -f p2p/wireguard-p2p/manage/wireguard-p2p.py
          test -f p2p/wireguard-p2p/linux/install_server.sh
          test -f p2p/wireguard-p2p/vps/install_vps.sh
          test -f p2p/wireguard-p2p/bootstrap/bootstrap-linux-client.sh
          test -f p2p/wireguard-p2p/bootstrap/bootstrap-linux-server.sh
          test -f p2p/wireguard-p2p/bootstrap/bootstrap-vps.py
          if find p2p -type f -name '*.exe' -print -quit | grep -q .; then
            echo 'compiled Windows EXE must not be tracked'
            exit 1
          fi
          if find . -type d -name __pycache__ -print -quit | grep -q .; then
            echo 'tracked/generated __pycache__ is not allowed'
            exit 1
          fi
      - name: Compile Python sources
        run: python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
      - name: Validate installers
        run: |
          sh -n p2p/wireguard-p2p/linux/install_server.sh
          sh -n p2p/wireguard-p2p/vps/install_vps.sh
          sh -n p2p/wireguard-p2p-client/deploy/linux/install.sh
          sh -n p2p/wireguard-p2p-client/deploy/linux/uninstall.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-client.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-server.sh
          python -m py_compile p2p/wireguard-p2p/bootstrap/bootstrap-vps.py
      - name: Run Python tests
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v

  python36-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.6.15'
      - name: Compile production code on Python 3.6
        run: python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
      - name: Run Python tests on Python 3.6
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-client/go.mod
          cache-dependency-path: p2p/wireguard-p2p-client/go.mod
      - name: Check gofmt
        working-directory: p2p/wireguard-p2p-client
        run: test -z "$(gofmt -l .)"
      - name: Vet shared client
        working-directory: p2p/wireguard-p2p-client
        run: go vet ./...
      - name: Test shared client on Linux
        working-directory: p2p/wireguard-p2p-client
        run: go test ./...
      - name: Build Windows amd64
        working-directory: p2p/wireguard-p2p-client
        run: |
          mkdir -p dist/windows-amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/windows-amd64/wireguard-p2p.exe .
      - name: Build Linux amd64 package
        working-directory: p2p/wireguard-p2p-client
        run: |
          mkdir -p dist/linux-amd64/package
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/linux-amd64/package/wireguard-p2p .
          cp deploy/linux/install.sh deploy/linux/uninstall.sh deploy/linux/wireguard-p2p-client.service dist/linux-amd64/package/
          chmod 0755 dist/linux-amd64/package/wireguard-p2p dist/linux-amd64/package/install.sh dist/linux-amd64/package/uninstall.sh
          tar -C dist/linux-amd64/package -czf dist/wireguard-p2p-linux-amd64.tar.gz .
      - name: Build Linux arm64 package
        working-directory: p2p/wireguard-p2p-client
        run: |
          mkdir -p dist/linux-arm64/package
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/linux-arm64/package/wireguard-p2p .
          cp deploy/linux/install.sh deploy/linux/uninstall.sh deploy/linux/wireguard-p2p-client.service dist/linux-arm64/package/
          chmod 0755 dist/linux-arm64/package/wireguard-p2p dist/linux-arm64/package/install.sh dist/linux-arm64/package/uninstall.sh
          tar -C dist/linux-arm64/package -czf dist/wireguard-p2p-linux-arm64.tar.gz .
      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-p2p-windows-amd64
          path: p2p/wireguard-p2p-client/dist/windows-amd64/wireguard-p2p.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux amd64 client
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-p2p-linux-amd64
          path: p2p/wireguard-p2p-client/dist/wireguard-p2p-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux arm64 client
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-p2p-linux-arm64
          path: p2p/wireguard-p2p-client/dist/wireguard-p2p-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, python36-compat, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wireguard-p2p-windows-amd64
          path: dist/download/windows
      - uses: actions/download-artifact@v4
        with:
          name: wireguard-p2p-linux-amd64
          path: dist/download/linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: wireguard-p2p-linux-arm64
          path: dist/download/linux-arm64
      - name: Build release payloads and manifest
        id: release_meta
        run: |
          set -eu
          mkdir -p dist/release dist/server dist/vps
          cp dist/download/windows/wireguard-p2p.exe dist/release/wireguard-p2p-windows-amd64.exe
          cp dist/download/linux-amd64/wireguard-p2p-linux-amd64.tar.gz dist/release/
          cp dist/download/linux-arm64/wireguard-p2p-linux-arm64.tar.gz dist/release/

          cp p2p/wireguard-p2p/linux/p2p_agent.py \
             p2p/wireguard-p2p/linux/candidates.py \
             p2p/wireguard-p2p/linux/portmap.py \
             p2p/wireguard-p2p/linux/portmap_daemon.py \
             p2p/wireguard-p2p/linux/wireguard-p2p-agent.service \
             p2p/wireguard-p2p/linux/wireguard-p2p-portmap.service \
             p2p/wireguard-p2p/linux/install_server.sh \
             dist/server/
          cp p2p/wireguard-p2p/manage/wireguard-p2p.py dist/server/
          chmod 0755 dist/server/install_server.sh
          tar -C dist/server -czf dist/release/wireguard-p2p-server.tar.gz .

          cp p2p/wireguard-p2p/vps/peers_api.py \
             p2p/wireguard-p2p/vps/peers-api.service \
             p2p/wireguard-p2p/vps/install_vps.sh \
             dist/vps/
          cp p2p/wireguard-p2p/manage/wireguard-p2p.py dist/vps/
          chmod 0755 dist/vps/install_vps.sh
          tar -C dist/vps -czf dist/release/wireguard-p2p-vps.tar.gz .

          cp p2p/wireguard-p2p/bootstrap/bootstrap-linux-client.sh dist/release/
          cp p2p/wireguard-p2p/bootstrap/bootstrap-linux-server.sh dist/release/
          cp p2p/wireguard-p2p/bootstrap/bootstrap-vps.py dist/release/

          python - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('dist/release')
          main = pathlib.Path('p2p/wireguard-p2p-client/main.go').read_text()
          version = re.search(r'\bversion\s*=\s*"([^"]+)"', main).group(1)
          names = {
              'windows-amd64': 'wireguard-p2p-windows-amd64.exe',
              'linux-amd64': 'wireguard-p2p-linux-amd64.tar.gz',
              'linux-arm64': 'wireguard-p2p-linux-arm64.tar.gz',
              'server-linux': 'wireguard-p2p-server.tar.gz',
              'vps-linux': 'wireguard-p2p-vps.tar.gz',
              'bootstrap-linux-client': 'bootstrap-linux-client.sh',
              'bootstrap-linux-server': 'bootstrap-linux-server.sh',
              'bootstrap-vps': 'bootstrap-vps.py',
          }
          assets = {}
          for key, name in names.items():
              data = (root / name).read_bytes()
              assets[key] = {'file': name, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          manifest = {'version': version, 'protocol': 7, 'assets': assets}
          (root / 'manifest.json').write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          pathlib.Path('/tmp/p2p-version').write_text(version)
          PY
          VERSION=$(cat /tmp/p2p-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          (cd dist/release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
      - name: Publish immutable version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Release $TAG already points to $TAG_SHA; bump VERSION before publishing another build." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/release/* --clobber
          else
            gh release create "$TAG" dist/release/* \
              --target "$GITHUB_SHA" \
              --title "WireGuard P2P ${VERSION}" \
              --notes "Managed update release ${VERSION}."
          fi
