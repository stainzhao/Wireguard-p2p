name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository hygiene
        run: |
          test ! -e p2p/wireguard-p2p/linux/p2p_sync.py
          test ! -e p2p/wireguard-p2p/linux/wireguard-p2p-sync.service
          test ! -e p2p/wireguard-p2p-exe/wireguard-p2p.exe
          test ! -e p2p/wireguard-p2p/journald-wireguard-p2p.conf
          if find . -type d -name __pycache__ -print -quit | grep -q .; then
            echo 'tracked/generated __pycache__ is not allowed'
            exit 1
          fi
      - name: Compile Python sources
        run: python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps
      - name: Run Python tests
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-exe/go.mod
          cache-dependency-path: p2p/wireguard-p2p-exe/go.mod
      - name: Check gofmt
        working-directory: p2p/wireguard-p2p-exe
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: p2p/wireguard-p2p-exe
        run: go vet ./...
      - name: Test
        working-directory: p2p/wireguard-p2p-exe
        run: go test ./...
      - name: Build Windows amd64
        working-directory: p2p/wireguard-p2p-exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o wireguard-p2p.exe .
      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-p2p-windows-amd64
          path: p2p/wireguard-p2p-exe/wireguard-p2p.exe
          if-no-files-found: error
          retention-days: 14
