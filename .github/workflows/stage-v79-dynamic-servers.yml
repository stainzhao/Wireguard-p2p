name: stage-v79-dynamic-servers

on:
  push:
    branches: [work/v7.9-dynamic-servers]
    paths:
      - 'tools/apply_v79_dynamic_servers.py'
      - 'tools/patch_v79_tests.py'
      - '.github/workflows/stage-v79-dynamic-servers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v7.9-dynamic-servers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-client/go.mod
      - name: Apply v7.9 dynamic server refactor
        run: |
          python tools/apply_v79_dynamic_servers.py
          python tools/patch_v79_tests.py
      - name: Format Go
        run: gofmt -w p2p/wireguard-p2p-client/*.go
      - name: Validate Python and shell
        run: |
          python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
          sh -n p2p/wireguard-p2p/linux/install_server.sh
          sh -n p2p/wireguard-p2p/vps/install_vps.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-client.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-server.sh
          python -m unittest discover -s p2p/wireguard-p2p/tests -v
      - name: Go tests and cross-builds
        working-directory: p2p/wireguard-p2p-client
        run: |
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux-arm64 .
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A p2p README.md
          git commit -m 'feat: support dynamically authorized P2P servers'
          git push origin HEAD:work/v7.9-dynamic-servers
