name: polish v7.3

on:
  push:
    branches: ['work/v7.3-simultaneous-ipv6']
    paths:
      - '.github/workflows/polish-v7.3.yml'

permissions:
  contents: write

jobs:
  polish-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-exe/go.mod
          cache-dependency-path: p2p/wireguard-p2p-exe/go.mod
      - name: Apply health and README polish
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source fragment not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          agent = 'p2p/wireguard-p2p/linux/p2p_agent.py'
          replace(
              agent,
              '        with NONCE_LOCK:\n            nonce_count = len(SEEN_NONCES)\n        self.send_json(200, {',
              '        with NONCE_LOCK:\n            nonce_count = len(SEEN_NONCES)\n        with REFLEXIVE6_LOCK:\n            reflexive6_address = REFLEXIVE6_ADDRESS\n            reflexive6_updated = REFLEXIVE6_UPDATED\n        reflexive6_age = (\n            max(0, int(time.time() - reflexive6_updated))\n            if reflexive6_address and reflexive6_updated\n            else None\n        )\n        self.send_json(200, {'
          )
          replace(
              agent,
              '            "nonce_cache": nonce_count,\n        })',
              '            "nonce_cache": nonce_count,\n            "reflexive6": reflexive6_address,\n            "reflexive6_age": reflexive6_age,\n        })'
          )

          readme = 'p2p/wireguard-p2p/README.md'
          replace(readme, '# WireGuard P2P v7.1', '# WireGuard P2P v7.3')
          replace(
              readme,
              'v7.0 已完成 Candidate 快速探测和 session/nonce 安全控制面；v7.1 在此基础上启用 **PCP -> NAT-PMP -> UPnP 自动 IPv4 端口映射**，优先解决服务器处于对称 NAT 后时 `observed4` 不稳定的问题。',
              'v7.0 完成 Candidate 快速探测和 session/nonce 安全控制面；v7.1 加入 **PCP -> NAT-PMP -> UPnP 自动 IPv4 端口映射**；v7.2 完成 NAT66 `observed6` 被动学习与 confirmation rekey；v7.3 新增 **reflexive6 + 双向 simultaneous IPv6 punch**，用于客户端和服务器两侧都存在 IPv6 stateful firewall/NAT66 的场景。'
          )
          replace(
              readme,
              'lan4       1000   同局域网私有 IPv4\nhost6       900   公网可路由 IPv6\nmapped4     800   PCP/NAT-PMP/UPnP 显式映射\nobserved4   600   VPS 观察到的公网 IPv4 NAT Endpoint\npredicted4  400   对称 NAT 预测端口（v7.2 预留）',
              'lan4        1000   同局域网私有 IPv4\nhost6        900   原生公网 IPv6\nobserved6    850   WireGuard 已认证学习到的公网 IPv6 Endpoint\nreflexive6   825   NAT66 外部 IPv6 + WG ListenPort（未验证）\nmapped4      800   PCP/NAT-PMP/UPnP 显式映射\nobserved4    600   VPS 观察到的公网 IPv4 NAT Endpoint\npredicted4   400   IPv4 端口预测（预留）'
          )
          marker = '## v7.1 mapped4\n'
          section = '''## v7.3 simultaneous IPv6 punch\n\n当 Linux server 没有可发布的 native `host6`，但具备 IPv6 出站能力时，Agent 会在启动时发现 NAT66 后的公网 IPv6，并生成未验证的 `reflexive6` Candidate。Windows 对 `reflexive6` 主动探测，同时 Linux 对 Windows `host6` 主动探测，两个方向各保持最多约 8 秒重叠窗口。\n\n`reflexive6` 只是假设“外部 IPv6 + 当前 WireGuard ListenPort”可达；**没有 fresh authenticated WireGuard handshake 就绝不会安装 `/32`**。发现失败、端口被 NAT66 改写或双方防火墙仍无法穿透时，自动继续原有 Candidate 和 VPS relay。完整设计见 `docs/protocol-v7.3.md`。\n\n诊断 NAT66 公网地址：\n\n```bash\ncurl http://10.0.0.5:8898/health\n```\n\n返回中的 `reflexive6` 为 Agent 当前缓存的外部 IPv6。\n\n'''
          replace(readme, marker, section + marker)
          replace(
              readme,
              '全部失败后删除动态 Peer，继续走 VPS；退避为 60 秒、120 秒、随后 30 分钟。Candidate 变化会解除旧冷却并重新评估。',
              '全部失败后删除动态 Peer，继续走 VPS。Windows fallback 退避保持 60 秒、120 秒、随后 30 分钟；Linux Agent 为快速 NAT66 恢复使用 3 秒、10 秒、随后 30 分钟。Candidate 变化会解除旧冷却并重新评估。'
          )
          replace(
              readme,
              'docs/protocol-v7.md       v7.0 正式 Candidate/session/security 协议\ndocs/protocol-v7.1.md     v7.1 mapped4 端口映射',
              'docs/protocol-v7.md       v7.0 正式 Candidate/session/security 协议\ndocs/protocol-v7.1.md     v7.1 mapped4 端口映射\ndocs/protocol-v7.3.md     v7.3 reflexive6 / simultaneous IPv6 punch'
          )
          replace(
              readme,
              'backup/pre-v7.1-20260807\n```',
              'backup/pre-v7.1-20260807\nbackup/pre-v7.3-simultaneous-ipv6-20260807\n```'
          )
          old_roadmap = '''v7.1.x\n  实网验证 PCP/NAT-PMP/UPnP\n  可选 Windows 侧 mapped4\n  Linux host6 本地能力过滤收尾\n\nv7.2\n  NAT 行为探测\n  仅对端口分配可预测的 NAT 生成 predicted4\n\nv8（如确有需要）\n  userspace WireGuard + UDP mux / ICE'''
          new_roadmap = '''v7.3.x\n  实网验证不同家庭/校园 IPv6 防火墙下的 simultaneous punch\n  根据实测决定是否需要 UDP 端口变化检测\n\nv7.4（按需）\n  IPv6 端口改写/endpoint-dependent NAT66 行为探测\n  多候选 bounded port prediction\n\nv8（仅当内核 WireGuard 无法覆盖目标网络）\n  userspace WireGuard + UDP mux / ICE-like coordination'''
          replace(readme, old_roadmap, new_roadmap)
          PY
      - name: Gofmt
        run: gofmt -w p2p/wireguard-p2p-exe/candidate.go p2p/wireguard-p2p-exe/candidate_test.go p2p/wireguard-p2p-exe/probe.go p2p/wireguard-p2p-exe/main.go
      - name: Check diff
        run: git diff --check
      - name: Run Python tests
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v
      - name: Run Go tests
        working-directory: p2p/wireguard-p2p-exe
        run: go test ./...
      - name: Build Windows amd64
        working-directory: p2p/wireguard-p2p-exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/wireguard-p2p-v7.exe .
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p2p/wireguard-p2p/linux/p2p_agent.py \
                  p2p/wireguard-p2p/README.md \
                  p2p/wireguard-p2p-exe/candidate.go \
                  p2p/wireguard-p2p-exe/candidate_test.go \
                  p2p/wireguard-p2p-exe/probe.go \
                  p2p/wireguard-p2p-exe/main.go
          git commit -m 'docs: polish v7.3 diagnostics and protocol'
          git push origin HEAD:work/v7.3-simultaneous-ipv6
