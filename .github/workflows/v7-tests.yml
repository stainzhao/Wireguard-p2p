name: v7 tests

on:
  push:
    branches: [main]
    paths:
      - 'p2p/wireguard-p2p/**'
      - 'p2p/wireguard-p2p-exe/**'
      - '.github/workflows/v7-tests.yml'
  pull_request:
    paths:
      - 'p2p/wireguard-p2p/**'
      - 'p2p/wireguard-p2p-exe/**'
      - '.github/workflows/v7-tests.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run coordinator and agent tests
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-exe/go.mod
          cache-dependency-path: p2p/wireguard-p2p-exe/go.mod
      - name: Run Windows client source tests
        working-directory: p2p/wireguard-p2p-exe
        run: go test ./...
