name: stage-v710-generic-roles

on:
  push:
    branches: [work/v7.10-generic-roles]
    paths:
      - 'tools/apply_v710_generic_roles.py'
      - 'tools/fix_v710_stage.py'
      - 'tools/post_v710_stage.py'
      - '.github/workflows/stage-v710-generic-roles.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v7.10-generic-roles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-client/go.mod
      - name: Apply v7.10 generic role refactor
        run: |
          python tools/fix_v710_stage.py
          python tools/apply_v710_generic_roles.py
          python tools/post_v710_stage.py
      - name: Format Go
        run: gofmt -w p2p/wireguard-p2p-client/*.go
      - name: Validate Python and shell
        run: |
          python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
          sh -n p2p/wireguard-p2p/linux/install_server.sh
          sh -n p2p/wireguard-p2p/vps/install_vps.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-client.sh
          sh -n p2p/wireguard-p2p/bootstrap/bootstrap-linux-server.sh
          python -m unittest discover -s p2p/wireguard-p2p/tests -v
      - name: Go tests and cross-builds
        working-directory: p2p/wireguard-p2p-client
        run: |
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux-arm64 .
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md p2p
          git commit -m 'feat: make node roles fully configuration-driven'
          git push origin HEAD:work/v7.10-generic-roles
