name: apply v7.3 simultaneous IPv6 punch

on:
  push:
    branches: ['work/v7.3-simultaneous-ipv6']
    paths:
      - '.github/workflows/apply-v7.3-simultaneous-ipv6.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-exe/go.mod
          cache-dependency-path: p2p/wireguard-p2p-exe/go.mod
      - name: Apply v7.3 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected source fragment not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          candidates = 'p2p/wireguard-p2p/linux/candidates.py'
          replace(candidates, '    "observed6": 850,\n    "mapped4": 800,', '    "observed6": 850,\n    "reflexive6": 825,\n    "mapped4": 800,')
          reflexive_helper = '''\n\ndef reflexive6_candidate(address, listen_port):\n    try:\n        ip = ipaddress.ip_address(address)\n        port = int(listen_port)\n    except (TypeError, ValueError):\n        return None\n    if not usable_global_ipv6(ip) or not 1 <= port <= 65535:\n        return None\n    return {\n        "type": "reflexive6",\n        "family": "udp6",\n        "endpoint": format_endpoint(ip, port),\n        "priority": PRIORITY["reflexive6"],\n        "verified": False,\n    }\n'''
          replace(candidates, '\n\ndef mapped_candidate_from_state(', reflexive_helper + '\n\ndef mapped_candidate_from_state(')
          replace(candidates, 'if candidate_type in ("host6", "observed6") and not usable_global_ipv6(address):', 'if candidate_type in ("host6", "observed6", "reflexive6") and not usable_global_ipv6(address):')
          replace(candidates, 'if candidate["type"] in ("host6", "observed6") and not allow_ipv6:', 'if candidate["type"] in ("host6", "observed6", "reflexive6") and not allow_ipv6:')

          agent = 'p2p/wireguard-p2p/linux/p2p_agent.py'
          replace(agent, 'import uuid\n', 'import uuid\nimport urllib.request\n')
          replace(agent, '    global_ipv6_addresses,\n    select_probe_candidates,\n)', '    global_ipv6_addresses,\n    reflexive6_candidate,\n    select_probe_candidates,\n    usable_global_ipv6,\n)')
          replace(agent, 'VERSION = "7.2.2"', 'VERSION = "7.3.0"')
          replace(agent, 'CONFIRMATION_REKEY_WINDOW = 8.0\nRETRY_DELAYS = (3, 10)', 'CONFIRMATION_REKEY_WINDOW = 8.0\nSIMULTANEOUS_IPV6_WINDOW = 8.0\nREFLEXIVE6_TTL = 600\nREFLEXIVE6_REFRESH_INTERVAL = 300\nREFLEXIVE6_DISCOVERY_TIMEOUT = 1.5\nREFLEXIVE6_DISCOVERY_URLS = (\n    "https://api6.ipify.org",\n    "https://6.ident.me",\n    "https://ipv6.icanhazip.com",\n)\nRETRY_DELAYS = (3, 10)')
          replace(agent, 'WG_LOCK = threading.Lock()\nSTOP = threading.Event()', 'WG_LOCK = threading.Lock()\nREFLEXIVE6_LOCK = threading.Lock()\nREFLEXIVE6_ADDRESS = ""\nREFLEXIVE6_UPDATED = 0\nSTOP = threading.Event()')

          helper = base64.b64decode('').decode()
          replace(agent, '\n\ndef should_confirmation_rekey(candidate):', '\n\n' + helper + '\n\ndef should_confirmation_rekey(candidate):')
          replace(agent, 'allowed_types = {"lan4", "host6", "mapped4", "observed4", "predicted4"}', 'allowed_types = {"lan4", "host6", "reflexive6", "mapped4", "observed4", "predicted4"}')
          replace(agent, 'deadline = time.monotonic() + CANDIDATE_PROBE_WINDOW', 'deadline = time.monotonic() + candidate_probe_window(candidate)')
          replace(agent, '    lan_ip = local_ipv4()\n    wg_port = listen_port()\n    return {\n        "ok": True,\n        "version": VERSION,\n        "protocol": 7,\n        "session_id": session_id,\n        "key": public_key(),\n        "ip": LISTEN_ADDRESS,\n        "lan_ip": lan_ip,\n        "listen_port": wg_port,\n        "candidates": gather_candidates(wg_port, lan_ip),\n    }', '    lan_ip = local_ipv4()\n    wg_port = listen_port()\n    local_candidates = gather_candidates(wg_port, lan_ip)\n    reflexive = current_reflexive6_candidate(wg_port)\n    if reflexive:\n        local_candidates.append(reflexive)\n        local_candidates.sort(key=lambda item: (-int(item.get("priority", 0)), item.get("endpoint", "")))\n    return {\n        "ok": True,\n        "version": VERSION,\n        "protocol": 7,\n        "session_id": session_id,\n        "key": public_key(),\n        "ip": LISTEN_ADDRESS,\n        "lan_ip": lan_ip,\n        "listen_port": wg_port,\n        "candidates": local_candidates,\n    }')
          replace(agent, '    cleanup_orphans()\n    monitor = threading.Thread(target=monitor_loop, name="peer-monitor")', '    cleanup_orphans()\n    refresh_reflexive_ipv6()\n    reflexive_monitor = threading.Thread(target=reflexive6_loop, name="reflexive6-monitor")\n    reflexive_monitor.daemon = True\n    reflexive_monitor.start()\n    monitor = threading.Thread(target=monitor_loop, name="peer-monitor")')

          api = 'p2p/wireguard-p2p/vps/peers_api.py'
          replace(api, 'VERSION = "7.2.2"', 'VERSION = "7.3.0"')
          replace(api, 'allowed_types = {"lan4", "host6", "mapped4", "predicted4"}', 'allowed_types = {"lan4", "host6", "reflexive6", "mapped4", "predicted4"}')
          replace(api, 'if candidate_type == "host6" and (', 'if candidate_type in ("host6", "reflexive6") and (')

          go_candidate = 'p2p/wireguard-p2p-exe/candidate.go'
          replace(go_candidate, '\tcandidatePriorityObserved6 = 850\n\tcandidatePriorityMapped4   = 800', '\tcandidatePriorityObserved6 = 850\n\tcandidatePriorityReflexive6 = 825\n\tcandidatePriorityMapped4   = 800')
          replace(go_candidate, '\tcase "observed6":\n\t\treturn candidatePriorityObserved6\n\tcase "mapped4":', '\tcase "observed6":\n\t\treturn candidatePriorityObserved6\n\tcase "reflexive6":\n\t\treturn candidatePriorityReflexive6\n\tcase "mapped4":')
          replace(go_candidate, '\tcase "host6", "observed6":', '\tcase "host6", "observed6", "reflexive6":')
          replace(go_candidate, 'if (candidate.Type == "host6" || candidate.Type == "observed6") && !allowIPv6 {', 'if (candidate.Type == "host6" || candidate.Type == "observed6" || candidate.Type == "reflexive6") && !allowIPv6 {')

          probe = 'p2p/wireguard-p2p-exe/probe.go'
          replace(probe, '\tprobeKeepalive       = 1\n)', '\tprobeKeepalive       = 1\n\tsimultaneousIPv6Window = 8 * time.Second\n)')
          probe_helper = '''\nfunc probeWindowForCandidate(candidate Candidate) time.Duration {\n\tif candidate.Type == "reflexive6" {\n\t\treturn simultaneousIPv6Window\n\t}\n\treturn candidateProbeWindow\n}\n\n'''
          replace(probe, '\nfunc (a *app) reconcilePeers(', '\n' + probe_helper + 'func (a *app) reconcilePeers(')
          replace(probe, '\t\tif !a.probeGenerationCurrent(key, generation) {\n\t\t\treturn\n\t\t}\n\t\tlocal, _ := a.localPeer(key)', '\t\tif !a.probeGenerationCurrent(key, generation) {\n\t\t\treturn\n\t\t}\n\t\tif candidate.Type == "reflexive6" {\n\t\t\ta.log("Simultaneous IPv6 punch " + serverIP + " via " + candidate.Endpoint + ".")\n\t\t}\n\t\tlocal, _ := a.localPeer(key)')
          replace(probe, 'deadline := time.Now().Add(candidateProbeWindow)', 'deadline := time.Now().Add(probeWindowForCandidate(candidate))')

          replace('p2p/wireguard-p2p-exe/main.go', 'version          = "7.2.2"', 'version          = "7.3.0"')
          replace('p2p/wireguard-p2p/tests/test_fast_punch_v7.py', 'self.assertEqual(agent.VERSION, "7.2.2")', 'self.assertEqual(agent.VERSION, "7.3.0")')

          go_test = 'p2p/wireguard-p2p-exe/candidate_test.go'
          extra_go = '''func TestReflexive6CandidateAcceptedForPunch(t *testing.T) {\n\tcandidate, ok := normalizeCandidate(Candidate{Type: "reflexive6", Endpoint: "[2001:da8:216:191a::1]:33967", Priority: 825})\n\tif !ok || candidate.Type != "reflexive6" || candidate.Family != "udp6" {\n\t\tt.Fatalf("unexpected reflexive6 candidate: %+v ok=%v", candidate, ok)\n\t}\n\tif got := probeWindowForCandidate(candidate); got != simultaneousIPv6Window {\n\t\tt.Fatalf("reflexive6 window=%v want %v", got, simultaneousIPv6Window)\n\t}\n}\n\n'''
          replace(go_test, 'func TestBuildProbeCandidatesKeepsLANOnSameNAT', extra_go + 'func TestBuildProbeCandidatesKeepsLANOnSameNAT')

          test_data = base64.b64decode('')
          Path('p2p/wireguard-p2p/tests/test_ipv6_simultaneous_v73.py').write_bytes(test_data)
          PY
      - name: Check diff
        run: git diff --check
      - name: Run Python tests
        run: python -m unittest discover -s p2p/wireguard-p2p/tests -v
      - name: Run Go tests
        working-directory: p2p/wireguard-p2p-exe
        run: go test ./...
      - name: Build Windows amd64
        working-directory: p2p/wireguard-p2p-exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/wireguard-p2p-v7.exe .
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add p2p/wireguard-p2p/linux/candidates.py \
                  p2p/wireguard-p2p/linux/p2p_agent.py \
                  p2p/wireguard-p2p/vps/peers_api.py \
                  p2p/wireguard-p2p-exe/candidate.go \
                  p2p/wireguard-p2p-exe/candidate_test.go \
                  p2p/wireguard-p2p-exe/probe.go \
                  p2p/wireguard-p2p-exe/main.go \
                  p2p/wireguard-p2p/tests/test_fast_punch_v7.py \
                  p2p/wireguard-p2p/tests/test_ipv6_simultaneous_v73.py
          git commit -m 'feat: add simultaneous IPv6 NAT traversal'
          git push origin HEAD:work/v7.3-simultaneous-ipv6
