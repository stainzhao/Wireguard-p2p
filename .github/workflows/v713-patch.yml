name: Apply v7.13.0 performance update

on:
  push:
    branches:
      - agent/network-performance-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/network-performance-recovery
          fetch-depth: 0
      - name: Apply v7.13.0 recovery policy
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Coordinated release bump across source, tests and docs.
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.py', '.go', '.md', '.sh', '.yml', '.yaml', '.service'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '7.12.1' in text:
                  path.write_text(text.replace('7.12.1', '7.13.0'), encoding='utf-8')

          agent_path = Path('p2p/wireguard-p2p/linux/p2p_agent.py')
          text = agent_path.read_text(encoding='utf-8')
          replacements = {
              'INITIATOR_SYNC_INTERVAL = 15': 'INITIATOR_SYNC_INTERVAL = 10',
              'DIRECT_MONITOR_INTERVAL = 30': 'DIRECT_MONITOR_INTERVAL = 20',
              'RETRY_DELAYS = (3, 10)': 'RETRY_DELAYS = (3, 10, 30, 60)',
              'FAILURE_COOLDOWN = 1800': 'FAILURE_COOLDOWN = 300',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected agent setting missing: ' + old)
              text = text.replace(old, new, 1)
          agent_path.write_text(text, encoding='utf-8')

          runtime_path = Path('p2p/wireguard-p2p/tests/test_runtime.py')
          text = runtime_path.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertEqual(agent.DIRECT_MONITOR_INTERVAL, 30)',
              'self.assertEqual(agent.DIRECT_MONITOR_INTERVAL, 20)'
          )
          text = text.replace(
              'self.assertEqual(agent.INITIATOR_SYNC_INTERVAL, 15)',
              'self.assertEqual(agent.INITIATOR_SYNC_INTERVAL, 10)'
          )
          anchor = '        self.assertEqual(agent.INITIATOR_ONLINE_MAX_AGE, 180)\n'
          extra = (
              '        self.assertEqual(agent.RETRY_DELAYS, (3, 10, 30, 60))\n'
              '        self.assertEqual(agent.FAILURE_COOLDOWN, 300)\n'
          )
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('runtime test anchor missing')
              text = text.replace(anchor, anchor + extra, 1)
          runtime_path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## v7.13.0 network recovery policy'
          if marker not in text:
              text += '''\n\n## v7.13.0 network recovery policy\n\nv7.13.0 keeps the WireGuard data plane unchanged and optimizes recovery around it. Windows/shared clients sync active topology every 10 s and healthy Direct topology every 20 s, cap coordinator retry backoff at 30 s, and retry failed Direct paths at 15 s / 30 s / 60 s / 5 min. Linux Server initiators sync every 10 s and retain their faster 3 s / 10 s first retries before 30 s / 60 s / 5 min fallback retries. VPS Relay remains available throughout probing. MTU, PersistentKeepalive, candidate priorities, fresh-handshake promotion and the /32 Direct routing model are unchanged.\n'''
          readme.write_text(text, encoding='utf-8')

          operations = Path('p2p/wireguard-p2p/docs/operations.md')
          text = operations.read_text(encoding='utf-8')
          marker = '## v7.13.0 recovery timing'
          if marker not in text:
              text += '''\n\n## v7.13.0 recovery timing\n\n- Shared client: active Coordinator sync 10 s; stable Direct sync 20 s.\n- Shared client Direct retry: 15 s, 30 s, 60 s, then 5 min.\n- Linux Server initiator sync: 10 s.\n- Linux Server Direct retry: 3 s, 10 s, 30 s, 60 s, then 5 min.\n- Linux Server Direct monitor: 20 s.\n- Coordinator transport-error retry is capped at 30 s on the shared client.\n- These timers affect control/recovery only; established Direct traffic remains kernel WireGuard traffic and does not traverse the VPS.\n'''
          operations.write_text(text, encoding='utf-8')

          architecture = Path('p2p/wireguard-p2p/docs/architecture.md')
          text = architecture.read_text(encoding='utf-8')
          marker = '### v7.13.0 recovery behavior'
          if marker not in text:
              text += '''\n\n### v7.13.0 recovery behavior\n\nv7.13.0 separates data-plane performance from control-plane recovery. Established Direct peers are not periodically rebuilt or rate-limited. Faster Coordinator observation and bounded retry backoff only reduce the time a recoverable peer spends on VPS Relay after restart, address change, or transient path failure.\n'''
          architecture.write_text(text, encoding='utf-8')
          PY

          # Remove this one-shot workflow from the resulting tree.
          rm -f .github/workflows/v713-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v7.13.0: optimize P2P network recovery"
          git push origin HEAD:agent/network-performance-recovery
