name: stage-python36-time-ns

on:
  push:
    branches: [work/v7.10.1-permission-fix]
    paths:
      - 'tools/fix_python36_time_ns.py'
      - '.github/workflows/stage-python36-time-ns.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v7.10.1-permission-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Python 3.6 time_ns fix
        run: python tools/fix_python36_time_ns.py
      - name: Validate generated source
        run: |
          python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
          python -m unittest discover -s p2p/wireguard-p2p/tests -v
          sh ci/test-python36.sh
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A p2p
          git commit -m 'fix: support Python 3.6 nanosecond timestamps'
          git push origin HEAD:work/v7.10.1-permission-fix
