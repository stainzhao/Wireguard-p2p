name: stage-v7121-fast-recovery

on:
  push:
    branches: [work/v7.12.1-fast-recovery]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v7.12.1-fast-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: p2p/wireguard-p2p-client/go.mod
          cache-dependency-path: p2p/wireguard-p2p-client/go.mod
      - name: Apply v7.12.1 transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v7121_fast_recovery.py')
          text = path.read_text(encoding='utf-8')
          old = 'replace_once(main_go, old_reconcile, new_reconcile)'
          new = 'replace_once("p2p/wireguard-p2p-client/probe.go", old_reconcile, new_reconcile)'
          if text.count(old) != 1:
              raise SystemExit('unexpected reconcile transform anchor')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/apply_v7121_fast_recovery.py
      - name: Format Go
        run: gofmt -w p2p/wireguard-p2p-client/main.go p2p/wireguard-p2p-client/main_test.go p2p/wireguard-p2p-client/probe.go
      - name: Compile and test Python
        run: |
          python -m compileall -q p2p/wireguard-p2p/linux p2p/wireguard-p2p/vps p2p/wireguard-p2p/manage p2p/wireguard-p2p/bootstrap
          python -m unittest discover -s p2p/wireguard-p2p/tests -v
      - name: Python 3.6 compatibility
        run: sh ci/test-python36.sh
      - name: Test and vet Go client
        working-directory: p2p/wireguard-p2p-client
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/wireguard-p2p-linux-arm64 .
      - name: Commit generated source
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md p2p
          git diff --cached --check
          git commit -m 'fix: recover P2P immediately after peer restart'
          git push origin HEAD:work/v7.12.1-fast-recovery
